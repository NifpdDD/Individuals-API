spring:
  # 1. Заменяем ShardingSphere на чистый PostgreSQL драйвер
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/transaction
    username: test
    password: test

    # 2. Переопределяем путь, чтобы ShardingSphere не пытался инициализироваться в тестах
    sharding-config-path: ""

  # 3. Включаем и настраиваем Flyway
  flyway:
    enabled: true
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    locations: classpath:db/migration/v1
    baseline-on-migrate: true

# 4. Отключаем JSON-формат логов для удобного чтения в консоли IntelliJ IDEA (опционально)
logging:
  format:
    json:
      enabled: false
