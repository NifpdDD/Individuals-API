
app:
  outbox:
    scheduler-delay-ms: 10000
    page-size: 100

spring:
  kafka:
    topics:
      transactions-in: "transactions_topic_in"
      transactions-out: "transactions_topic_out"
      transactions-out-dlq: "transactions_topic_out_DLQ"
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_HOST:localhost}:${SPRING_KAFKA_BOOTSTRAP_PORT:9095}
    consumer:
      group-id: transaction-service-dev
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        request.timeout.ms: 30000
        acks: "all"
        enable.idempotence: true
        batch.size: 65536
        linger.ms: 10



  application:
    name: transaction-service
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    sharding-config-path: shardingsphere.yaml
    url: jdbc:shardingsphere:classpath:${spring.datasource.sharding-config-path}?placeholder-type=environment
logging:
  format:
    json:
      enabled: true
  pattern:
    dateformat: "yyyy-MM-dd'T'HH:mm:ss.SSSX"
  level:
    root: INFO
    transaction_service: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: WARN       

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      access: read_only

  # Включаем трассировку на 100%
  tracing:
    sampling:
      probability: 1.0

  # Единый блок OpenTelemetry для Spring Boot 4
  opentelemetry:
    tracing:
      export:
        otlp:
          # 1. Меняем дефолтный порт на 4317 и убираем путь /v1/traces (gRPC требует только хост:порт)
          endpoint: ${OTLP_EXPORTER_ENDPOINT:http://localhost:4317}
          transport: grpc


server:
  port: 8099
