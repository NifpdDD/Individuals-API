databaseName: logic_transaction

dataSources:
  ds_0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: org.postgresql.Driver
    jdbcUrl: jdbc:postgresql://localhost:5435/transaction
    username: postgres
    password: postgres
  ds_1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: org.postgresql.Driver
    jdbcUrl: jdbc:postgresql://localhost:5434/transaction
    username: postgres
    password: postgres

rules:
  - !SHARDING
    tables:
      wallets:
        actualDataNodes: ds_${0..1}.wallets
        databaseStrategy:
          standard:
            shardingColumn: user_uuid
            shardingAlgorithmName: uuid_user_inline
      transactions:
        actualDataNodes: ds_${0..1}.transactions
        databaseStrategy:
          standard:
            shardingColumn: user_uuid
            shardingAlgorithmName: uuid_user_inline

    shardingAlgorithms:
      uuid_user_inline:
        type: INLINE
        props:
          algorithm-expression: ds_${(user_uuid.toString().hashCode() & 0x7fffffff) % 2}

  - !BROADCAST
    tables:
      - wallet_types